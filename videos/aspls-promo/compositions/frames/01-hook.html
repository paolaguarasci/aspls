  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const DURATION = 5.056;

      const BEAT_TIMES = [
        { t: 0.08, index: 0 },
        { t: 0.81, index: 1 },
        { t: 1.92, index: 2 },
        { t: 2.64, index: 3 },
        { t: 4.02, index: 4 },
      ];

      const T_UNDERLINE = 2.72;
      const T_ICON = 4.02;

      const beats = [
        document.getElementById("01-hook-beat-1"),
        document.getElementById("01-hook-beat-2"),
        document.getElementById("01-hook-beat-3"),
        document.getElementById("01-hook-beat-4"),
        document.getElementById("01-hook-beat-5"),
      ];

      const beat1Inner = document.getElementById("01-hook-beat-1-inner");
      const depthBack = document.getElementById("01-hook-depth-back");
      const depthFront = document.getElementById("01-hook-depth-front");
      const underline = document.getElementById("01-hook-underline");
      const icon = document.getElementById("01-hook-icon");

      const OFFSET_X = 2;
      const OFFSET_Y = 2;

      function activeBeatAt(time) {
        let active = 0;
        for (let i = BEAT_TIMES.length - 1; i >= 0; i--) {
          if (time >= BEAT_TIMES[i].t) {
            active = BEAT_TIMES[i].index;
            break;
          }
        }
        return active;
      }

      function syncBeats(time) {
        const active = activeBeatAt(time);
        beats.forEach(function (el, i) {
          gsap.set(el, {
            opacity: i === active ? 1 : 0,
            visibility: i === active ? "visible" : "hidden",
          });
        });
      }

      gsap.set(beats, { opacity: 0, visibility: "hidden" });
      gsap.set(beat1Inner, { opacity: 0, scale: 0.96 });
      gsap.set(depthBack, { opacity: 0, x: 0, y: 0 });
      gsap.set(depthFront, { opacity: 0, scale: 0.98 });
      gsap.set(underline, { scaleX: 0 });
      gsap.set(icon, { opacity: 0, scale: 0.92 });

      const tl = gsap.timeline({ paused: true });

      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            syncBeats(driver.t);
          },
        },
        0,
      );

      tl.fromTo(
        beat1Inner,
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out" },
        BEAT_TIMES[0].t,
      );

      tl.fromTo(
        depthBack,
        { opacity: 0, x: 0, y: 0 },
        { opacity: 1, x: OFFSET_X, y: OFFSET_Y, duration: 0.18, ease: "power2.out" },
        BEAT_TIMES[1].t,
      );

      tl.fromTo(
        depthFront,
        { opacity: 0, scale: 0.98 },
        { opacity: 1, scale: 1, duration: 0.15, ease: "power2.out" },
        BEAT_TIMES[1].t,
      );

      tl.to(
        underline,
        { scaleX: 1, duration: 0.22, ease: "power2.out" },
        T_UNDERLINE,
      );

      tl.fromTo(
        icon,
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" },
        T_ICON,
      );

      // Hard clear before cut — inactive hosts can leave the last beat painted
      tl.to(
        beats.concat([icon]),
        { opacity: 0, duration: 0.08, ease: "none", onComplete: function () {
          gsap.set(beats.concat([icon]), { visibility: "hidden" });
        } },
        DURATION - 0.08,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["01-hook"] = tl;
    })();
  </script>
