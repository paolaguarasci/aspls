  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const DURATION = 8.213;

      const T = {
        diagram: 0,
        kicker: 0.06,
        icon: 0.08,
        iconOut: 1.85,
        cards: [0.09, 1.28, 2.21, 3.64],
        float: 4.25,
        push: 4.25,
        payoff: 4.9,
      };

      const diagramImg = document.getElementById("05-intelligence-diagram-img");
      const kicker = document.getElementById("05-intelligence-kicker");
      const icon = document.getElementById("05-intelligence-icon");
      const camera = document.getElementById("05-intelligence-camera");
      const payoff = document.getElementById("05-intelligence-payoff");

      const cards = [
        document.getElementById("05-intelligence-card-0"),
        document.getElementById("05-intelligence-card-1"),
        document.getElementById("05-intelligence-card-2"),
        document.getElementById("05-intelligence-card-3"),
      ];

      const ghosts = [
        document.getElementById("05-intelligence-ghost-0"),
        document.getElementById("05-intelligence-ghost-1"),
        document.getElementById("05-intelligence-ghost-2"),
        document.getElementById("05-intelligence-ghost-3"),
      ];

      const GHOST_OFFSET = { x: 8, y: 8 };
      const EXPAND_DUR = 0.55;
      const STAGGER = 0.06;

      const tl = gsap.timeline({ paused: true });

      function assembleItem(el, at, ghostEl) {
        const targetX = Number(el.dataset.targetX);
        const targetY = Number(el.dataset.targetY);

        if (ghostEl) {
          tl.fromTo(
            ghostEl,
            {
              xPercent: -50,
              yPercent: -50,
              x: targetX * 0.35,
              y: targetY * 0.35,
              scale: 0.94,
              opacity: 0,
            },
            {
              x: targetX + GHOST_OFFSET.x,
              y: targetY + GHOST_OFFSET.y,
              scale: 1,
              opacity: 0.42,
              duration: EXPAND_DUR,
              ease: "power3.out",
            },
            at - STAGGER,
          );
        }

        tl.fromTo(
          el,
          {
            xPercent: -50,
            yPercent: -50,
            x: 0,
            y: 0,
            scale: 0.92,
            opacity: 0,
          },
          {
            x: targetX,
            y: targetY,
            scale: 1,
            opacity: 1,
            duration: EXPAND_DUR,
            ease: "power3.out",
          },
          at,
        );
      }

      gsap.set(diagramImg, { opacity: 0 });
      gsap.set(kicker, { opacity: 0, y: 6 });
      gsap.set(icon, { opacity: 0, scale: 0.88 });
      gsap.set(payoff, { opacity: 0, xPercent: -50, y: 12 });
      gsap.set(cards.concat(ghosts), {
        xPercent: -50,
        yPercent: -50,
        x: 0,
        y: 0,
        opacity: 0,
        scale: 0.92,
      });

      tl.fromTo(
        diagramImg,
        { opacity: 0 },
        { opacity: 0.1, duration: 0.7, ease: "power2.out" },
        T.diagram,
      );
      // Once cards take over, kill the diagram so label text never fights the grid
      tl.to(diagramImg, { opacity: 0, duration: 0.35, ease: "power2.out" }, T.cards[0] + 0.55);

      tl.fromTo(
        kicker,
        { opacity: 0, y: 6 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        T.kicker,
      );

      tl.fromTo(
        icon,
        { opacity: 0, scale: 0.88 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" },
        T.icon,
      );

      cards.forEach(function (card, i) {
        assembleItem(card, T.cards[i], ghosts[i]);
      });

      tl.to(
        icon,
        { opacity: 0, scale: 0.82, duration: 0.45, ease: "power2.inOut" },
        T.iconOut,
      );

      const phase = { scale: 1 };
      const drift = { p: 0 };

      tl.to(
        phase,
        { scale: 1.035, duration: 3.2, ease: "power1.inOut" },
        T.push,
      );

      tl.to(
        drift,
        {
          p: Math.PI * 2 * 1.2,
          duration: DURATION - T.float,
          ease: "none",
          onUpdate: function () {
            const dx = Math.sin(drift.p) * 1.2;
            const dy = Math.sin(drift.p * 1.3) * 0.9;
            camera.style.transform =
              "scale(" + phase.scale + ") translate(" + dx + "px, " + dy + "px)";
          },
        },
        T.float,
      );

      cards.forEach(function (card, i) {
        tl.to(
          card,
          {
            y: "+=" + 2,
            duration: 2.1,
            ease: "sine.inOut",
            yoyo: true,
            repeat: 1,
          },
          T.float + i * 0.18,
        );
      });

      // Clear the grid before the payoff so "One extension." never sits on the cards
      tl.to(
        cards.concat(ghosts),
        { opacity: 0, scale: 0.96, duration: 0.35, ease: "power2.inOut", stagger: 0.03 },
        T.payoff - 0.28,
      );
      tl.to(kicker, { opacity: 0, duration: 0.25, ease: "power2.out" }, T.payoff - 0.2);

      tl.fromTo(
        payoff,
        { opacity: 0, xPercent: -50, y: 12 },
        { opacity: 1, xPercent: -50, y: 0, duration: 0.45, ease: "power3.out" },
        T.payoff,
      );

      // Clear local stage before cut (never target global #root)
      tl.to(
        [camera, payoff, kicker, diagramImg],
        { opacity: 0, duration: 0.1, ease: "none" },
        Math.max(0, DURATION - 0.1),
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["05-intelligence"] = tl;
    })();
  </script>
