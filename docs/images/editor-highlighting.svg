  <text x="88" y="124" fill="#e8edf4" font-family="ui-monospace, monospace" font-size="13">(pingu).</text>

  <text x="24" y="160" fill="#7eb8f0" font-family="ui-monospace, monospace" font-size="13" font-weight="700">flies</text>
